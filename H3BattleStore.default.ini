; 战场存档出厂默认配置（随包分发，升级会被覆盖）。
; 玩家可改的设置请勿写在这里：同目录 H3BattleStore.user.ini 会叠加覆盖本文件。

[Logging]
; DisableLog=1 完全关闭日志；MinLevel=最小记录级别（trace/debug/info/warn/error）
; 当前出厂默认为 debug；仅在用户明确要求时改回 info，不自动回调。
; 悬浮框第一行的横向等级单选列表选中后即写入 H3BattleStore.user.ini 的同名键。
DisableLog=0
MinLevel=debug

[Hotkeys]
; G 为默认存档键；Z 已被 HoD 插件占用，不接受 Z。
SaveKey=G
; 2026-10-15 H3Auto（打铁助手）功能合并进本插件后，以下三个键沿用原插件语义：
; ToggleManual=启停自动执行（默认 F9）；OneShotManual=单次接管（只允许单个字母，默认 J）；
; OpenSettings=战斗中打开打铁设置面板（只允许单个字母，默认 P，且不得与 OneShotManual 相同）。
ToggleManual=F9
OneShotManual=J
OpenSettings=P

[General]
; 2026-10-15 移植自 H3Auto（打铁助手）：
; DisableOnStart=1 进战斗时不自动开启打铁（等价于先按一次 F9 关闭态启动）；
; LastProfile=面板默认选中的方案编号 1-5（勾号确认时自动写 H3BattleStore.user.ini）；
; Language=界面文案语言（lang\<语言>.ini 覆盖内置默认表；缺文件/缺键回落内置中文）。
DisableOnStart=0
LastProfile=1
Language=zh-CN

[Ui]
; OutsideBattlefield 界面选择：0（默认）=战场内右上角折叠状态灯，鼠标移到灯上
; 展开悬浮条；1=战场外左上角固定的常显悬浮条（旧界面）。也可在悬浮条第一行勾选
; 或取消「战场外」复选框，勾选即写回本键值并立即生效，无需重启游戏。
OutsideBattlefield=0

[Store]
; saveFormat 存档格式：binary（二进制 .hbs，默认）或 json（可读可改可 diff 的 .json）。
; 改格式=换后缀：两种后缀互不可见，旧档留盘不删；改回配置即可再见。改后需重启游戏生效。
; json 档按 <存档根>\<战斗指纹>\手动\<回合>_<编号>.json 组织（binary 同布局用 .hbs）。
saveFormat=binary
