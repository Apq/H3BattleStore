; 战场存档出厂默认配置（随包分发，升级会被覆盖）。
; 玩家可改的设置请勿写在这里：同目录 H3BattleStore.user.ini 会叠加覆盖本文件。

[Logging]
; DisableLog=1 完全关闭日志；MinLevel=最小记录级别（trace/debug/info/warn/error）
; 当前出厂默认为 debug；仅在用户明确要求时改回 info，不自动回调。
; 悬浮框第一行的横向等级单选列表选中后即写入 H3BattleStore.user.ini 的同名键。
DisableLog=0
MinLevel=debug

[Hotkeys]
; G 为默认存档键；Z 已被 HoD 插件占用，不接受 Z。
SaveKey=G

[Store]
; saveFormat 存档格式：binary（二进制 .hbs，默认）或 json（可读可改可 diff 的 .json）。
; 改格式=换后缀：两种后缀互不可见，旧档留盘不删；改回配置即可再见。改后需重启游戏生效。
; json 档按 <存档根>\<战斗指纹>\手动\<回合>_<编号>.json 组织（binary 同布局用 .hbs）。
saveFormat=binary
